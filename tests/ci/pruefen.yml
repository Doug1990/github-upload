name: Prüfen

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Chrome prüfen
        run: google-chrome --version
      - name: Seiten prüfen (Konsole, Überlauf, Links, Meta, fremde Requests)
        run: node tests/check.mjs --screens=${{ runner.temp }}/screens
      - name: Kontraste prüfen
        run: node tests/kontrast.mjs
      - name: Tastatur prüfen
        run: node tests/tastatur.mjs
      - name: Link-Knöpfe prüfen
        run: node tests/teilen.mjs --screens=${{ runner.temp }}/screens
      - name: Fließband prüfen
        run: node tests/fliessband.mjs --screens=${{ runner.temp }}/screens
      - name: Tag in der Zelle prüfen
        run: node tests/tag.mjs --screens=${{ runner.temp }}/screens
      - name: Fragen zum Schluss prüfen
        run: node tests/fragen.mjs --screens=${{ runner.temp }}/screens
      - name: Mikrotexte in Schemata prüfen
        run: node tests/mikrotext.mjs
      - name: Touch-Bedienung prüfen
        run: node tests/touch.mjs
      - name: Gene und Genregulation prüfen
        run: node tests/gene.mjs
      - name: Immunsystem prüfen
        run: node tests/immun.mjs
      - name: Ausfall in der Stadt prüfen
        run: node tests/stoerung.mjs
      - name: Screenshots bei Fehler sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/screens
          if-no-files-found: ignore
